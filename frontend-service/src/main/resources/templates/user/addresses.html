<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:htmx="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Addresses - E-Commerce</title>
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .nav-link:hover { color: #FF9900 !important; }
        .btn-primary { background: #FF9900; color: black; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col">
    <div th:replace="~{layout/base :: navbar}"></div>

    <div class="flex-1 max-w-7xl mx-auto w-full px-4 py-6">
        <div class="flex items-center justify-between mb-6">
            <h1 class="text-2xl font-bold">Your Addresses</h1>
            <button hx-get="/addresses/modal" hx-target="#address-modal-target" hx-swap="innerHTML"
                    class="btn-primary px-4 py-2 rounded font-bold">
                Add New Address
            </button>
        </div>

        <div id="address-grid">
            <div th:replace="~{user/address-grid :: grid}"></div>
        </div>
    </div>

    <div id="address-modal-target"></div>

    <div th:replace="~{layout/base :: footer}"></div>

    <script>
        document.body.addEventListener('htmx:afterSwap', function(evt) {
            if (evt.detail.target.id === 'address-modal-target') {
                var el = document.getElementById('address-modal-container');
                if (el) el.style.display = 'flex';
            }
        });
        document.body.addEventListener('htmx:beforeSwap', function(evt) {
            if (evt.detail.target.id === 'address-grid') {
                var el = document.getElementById('address-modal-container');
                if (el) el.style.display = 'none';
            }
        });
    </script>
</body>
</html>
