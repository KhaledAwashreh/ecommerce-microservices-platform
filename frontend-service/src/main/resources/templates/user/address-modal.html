<div th:fragment="modal" th:attrimpl:style="'display: flex;'" th:remove="all-but-first"
     class="fixed inset-0 bg-black bg-opacity-50 items-center justify-center z-50"
     id="address-modal-container"
     onclick="if(event.target===this) this.style.display='none'">
    <div class="bg-white rounded-lg shadow-lg p-6 max-w-md w-full mx-4">
        <div class="flex items-center justify-between mb-4">
            <h2 class="text-xl font-bold" th:text="${address != null} ? 'Edit Address' : 'Add New Address'">
                Add New Address
            </h2>
            <button type="button" onclick="document.getElementById('address-modal-container').style.display='none'"
                    class="text-gray-500 hover:text-gray-700 text-2xl">&times;</button>
        </div>
        <form th:action="${address != null} ? @{/addresses/edit/{id}(id=${address.id})} : @{/addresses/add}"
              th:hx-post="${address != null} ? '/addresses/edit/' + ${address.id} : '/addresses/add'"
              hx-target="#address-grid"
              hx-swap="outerHTML"
              class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700">Street Address</label>
                <input type="text" name="street" th:value="${address?.street}" required
                       class="mt-1 w-full border rounded px-3 py-2">
            </div>
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700">City</label>
                    <input type="text" name="city" th:value="${address?.city}" required
                           class="mt-1 w-full border rounded px-3 py-2">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">State</label>
                    <input type="text" name="state" th:value="${address?.state}" required
                           class="mt-1 w-full border rounded px-3 py-2">
                </div>
            </div>
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700">Postal Code</label>
                    <input type="text" name="postalCode" th:value="${address?.postalCode}" required
                           class="mt-1 w-full border rounded px-3 py-2">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Country</label>
                    <input type="text" name="country" th:value="${address?.country ?: 'USA'}" required
                           class="mt-1 w-full border rounded px-3 py-2">
                </div>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700">Phone Number</label>
                <input type="tel" name="phoneNumber" th:value="${address?.phoneNumber}" required
                       class="mt-1 w-full border rounded px-3 py-2">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700">Additional Information (Optional)</label>
                <textarea name="additionalInformation" rows="2"
                          class="mt-1 w-full border rounded px-3 py-2" th:text="${address?.additionalInformation}"></textarea>
            </div>
            <div class="flex items-center">
                <input type="checkbox" name="defaultAddress" id="modal-defaultAddress"
                       th:checked="${address?.defaultAddress}" class="h-4 w-4 text-yellow-500">
                <label for="modal-defaultAddress" class="ml-2 text-sm text-gray-700">Set as default address</label>
            </div>
            <div class="flex space-x-4 pt-2">
                <button type="submit" class="flex-1 btn-primary py-2 rounded font-bold">
                    <span th:text="${address != null} ? 'Update Address' : 'Save Address'">Save Address</span>
                </button>
                <button type="button" onclick="document.getElementById('address-modal-container').style.display='none'"
                        class="flex-1 border py-2 rounded font-bold hover:bg-gray-50">Cancel</button>
            </div>
        </form>
    </div>
</div>
