<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:htmx="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventory Detail - E-Commerce</title>
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .nav-link:hover { color: #FF9900 !important; }
        .btn-primary { background: #FF9900; color: black; }
        .btn-primary:hover { background: #F08800; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col">
    <div th:replace="~{layout/base :: navbar}"></div>

    <div class="flex-1 max-w-7xl mx-auto w-full px-4 py-6">
        <div class="flex items-center space-x-2 text-sm text-gray-600 mb-4">
            <a href="/" class="hover:underline">Home</a>
            <span>/</span>
            <a href="/inventory" class="hover:underline">Inventory</a>
            <span>/</span>
            <span class="font-medium text-gray-900">Detail</span>
        </div>

        <div th:if="${inventory != null}" class="bg-white rounded-lg shadow-sm p-6">
            <div class="flex items-center justify-between border-b pb-4 mb-4">
                <div class="flex items-center">
                    <div class="h-16 w-16 bg-gray-200 rounded flex items-center justify-center">
                        <span class="text-2xl">📦</span>
                    </div>
                    <div class="ml-4">
                        <p class="text-sm text-gray-500">Product Variation</p>
                        <p class="font-mono text-sm" th:text="${inventory.productVariationId}">abc123</p>
                    </div>
                </div>
                <span th:class="${'px-2 py-1 rounded text-xs font-bold ' +
                    (inventory.quantity > 10 ? 'bg-green-100 text-green-800' :
                     inventory.quantity > 0 ? 'bg-yellow-100 text-yellow-800' :
                     'bg-red-100 text-red-800')}"
                      th:text="${inventory.quantity > 0 ? 'In Stock' : 'Out of Stock'}">In Stock</span>
            </div>

            <div class="grid grid-cols-2 gap-4">
                <div>
                    <p class="text-sm text-gray-500">Quantity</p>
                    <p class="font-bold text-lg" th:text="${inventory.quantity}">50</p>
                </div>
                <div>
                    <p class="text-sm text-gray-500">Warehouse Location</p>
                    <p class="font-medium" th:text="${inventory.warehouseLocation ?: 'Main Warehouse'}">Warehouse A</p>
                </div>
            </div>

            <div class="mt-6 pt-4 border-t grid grid-cols-2 gap-4 text-sm text-gray-500">
                <div>
                    <p>Created</p>
                    <p class="text-gray-700" th:text="${#temporals.format(inventory.createdAt, 'MMM dd, yyyy')}">Jan 15, 2024</p>
                </div>
                <div>
                    <p>Last Updated</p>
                    <p class="text-gray-700" th:text="${#temporals.format(inventory.updatedAt, 'MMM dd, yyyy')}">Jan 15, 2024</p>
                </div>
            </div>
        </div>

        <div th:if="${inventory == null}" class="bg-white rounded-lg shadow-sm p-12 text-center">
            <span class="text-4xl block mb-4">📦</span>
            <p class="text-gray-500 mb-4" th:text="${error ?: 'Inventory item not found'}">Inventory item not found</p>
            <a href="/inventory" class="inline-block btn-primary px-6 py-2 rounded font-bold">Back to Inventory</a>
        </div>
    </div>

    <div th:replace="~{layout/base :: footer}"></div>
</body>
</html>
