# IDE Profile — run payment-service in IDE, everything else in Docker
server:
  port: 8084

GATEWAY_URL: http://localhost:8765

spring:
  datasource:
    url: jdbc:postgresql://localhost:5436/paymentdb
    username: postgres
    password: test1234
  cloud:
    openfeign:
      client:
        config:
          # order-service's container port isn't published to the host (unlike
          # api-gateway's), so payment-service running here in the IDE can't reach
          # http://order-service:8080 directly - go through the gateway instead.
          order-service:
            url: http://localhost:8765

management:
  zipkin:
    tracing:
      endpoint: http://localhost:9411/api/v2/spans
