# -------------------------------
# Payment Service Configuration
# -------------------------------
spring:
  application:
    name: payment-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/paymentdb}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  cloud:
    config:
      enabled: false
      discovery:
        enabled: false
    openfeign:
      circuitbreaker:
        enabled: true
      client:
        config:
          default:
            connectTimeout: 5000
            readTimeout: 10000
            loggerLevel: basic
          order-service:
            url: ${ORDER_SERVICE_URL:http://order-service:8080}
            errorDecoder: com.kawashreh.ecommerce.payment_service.infrastructure.http.client.OrderServiceErrorDecoder

server:
  port: 8080

jwt:
  # No default: a missing JWT_SECRET env var must fail startup, not fall back to a
  # committed value. Must match api-gateway/user-service's jwt.secret (same signing
  # key, HS256) — this service only verifies tokens, it doesn't issue them.
  secret: ${JWT_SECRET}

management:
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_BASE_URL:http://zipkin:9411}/api/v2/spans
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  tracing:
    sampling:
      probability: 1.0


# -------------------------------
# Database Environment Variables (optional, for clarity)
# -------------------------------
logging:
  pattern:
    level: "%5p [#{spring.application.name}, %X{traceId:-}, %X{spanId:-}]"

# -------------------------------
# Resilience4j Circuit Breaker & Retry
# -------------------------------
resilience4j:
  circuitbreaker:
    instances:
      order-service:
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        permittedNumberOfCallsInHalfOpenState: 3
        waitDurationInOpenState: 5s
        failureRateThreshold: 50
  retry:
    instances:
      order-service:
        maxAttempts: 3
        waitDuration: 1s
