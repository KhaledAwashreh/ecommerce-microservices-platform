# -------------------------------
# Order Service Configuration
# -------------------------------
spring:
  application:
    name: order-service
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/orderdb}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  cloud:
    openfeign:
      circuitbreaker:
        enabled: true
      client:
        config:
          default:
            connectTimeout: 5000
            readTimeout: 10000
            loggerLevel: basic
          # Service-to-service calls go direct by service name, not through the
          # gateway. The gateway's JwtAuthFilter requires a bearer token, and
          # order-service has no interceptor to attach one, so routing these
          # through it yields 401. This matches k8s/services/order-service/
          # order-configmap.yaml, which already overrides to direct DNS.
          product-service:
            url: ${PRODUCT_SERVICE_URL:http://product-service:8080}
            errorDecoder: com.kawashreh.ecommerce.order_service.infrastructure.http.client.ProductServiceErrorDecoder
          payment-service:
            url: ${PAYMENT_SERVICE_URL:http://payment-service:8080}
          user-service:
            url: ${USER_SERVICE_URL:http://user-service:8080}

server:
  port: 8080

management:
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_BASE_URL:http://zipkin:9411}/api/v2/spans

# -------------------------------
# Resilience4j Circuit Breaker & Retry
# -------------------------------
resilience4j:
  circuitbreaker:
    instances:
      product-service:
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        permittedNumberOfCallsInHalfOpenState: 3
        waitDurationInOpenState: 5s
        failureRateThreshold: 50
  retry:
    instances:
      product-service:
        maxAttempts: 3
        waitDuration: 1s

