apiVersion: v1
kind: ConfigMap
metadata:
  name: order-service-config
  namespace: ecommerce
data:
  SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-server:5432/orderdb
  SPRING_DATASOURCE_USERNAME: postgres
  SPRING_DATA_REDIS_HOST: redis-server
  SPRING_DATA_REDIS_PORT: "6379"
  # ProductServiceClient/PaymentClient already default to direct in-cluster DNS
  # (application.yml: ${PRODUCT_SERVICE_URL:http://product-service:8080},
  # ${PAYMENT_SERVICE_URL:http://payment-service:8080}) rather than the gateway. The
  # jar defaults' port (8080) is the pod's container port; the in-cluster Services
  # (k8s/services/product-service/product-service.yaml,
  # k8s/services/payment-service/payment-service.yaml) expose port 80, so it must be
  # overridden here or the Feign call can't reach the ClusterIP.
  PRODUCT_SERVICE_URL: http://product-service
  PAYMENT_SERVICE_URL: http://payment-service
