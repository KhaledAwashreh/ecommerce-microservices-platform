# -------------------------------
# Product Service Configuration
# -------------------------------
spring:
  application:
    name: product-service
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/productdb}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  cloud:
    config:
      enabled: false
      discovery:
        enabled: false
    openfeign:
      client:
        config:
          user-service:
            url: ${GATEWAY_URL:http://api-gateway:8765}

server:
  port: 8080

jwt:
  # No default: a missing JWT_SECRET env var must fail startup, not fall back to a
  # committed value. Must match api-gateway/user-service's jwt.secret (same signing
  # key, HS256) — this service only verifies tokens, it doesn't issue them.
  secret: ${JWT_SECRET}

management:
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_BASE_URL:http://zipkin:9411}/api/v2/spans
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  tracing:
    sampling:
      probability: 1.0


# -------------------------------
# Database Environment Variables (optional, for clarity)
# -------------------------------
logging:
  pattern:
    level: "%5p [#{spring.application.name}, %X{traceId:-}, %X{spanId:-}]"
